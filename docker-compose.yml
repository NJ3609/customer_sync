services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: customer_sync
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d customer_sync"]
      interval: 5s
      timeout: 5s
      retries: 10

  mock-crm:
    build: .
    command: uvicorn mock_crm.main:app --host 0.0.0.0 --port 9000
    ports:
      - "9000:9000"

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/customer_sync
      CRM_BASE_URL: http://mock-crm:9000
      CRM_API_KEY: dev-crm-key
      WEBHOOK_SECRET: super-secret
      REQUEST_TIMEOUT: 5
      MAX_RETRIES: 3
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      mock-crm:
        condition: service_started

volumes:
  postgres_data:
